apiVersion: 1
datasources:
  - name: app
    uid: app-pg
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana_ro
    isDefault: true
    jsonData:
      database: app
      sslmode: disable
      postgresVersion: 1700
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
